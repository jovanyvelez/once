# =============================================================================
# docker-compose.yml — Para DESARROLLO local
# Levanta la API + PostgreSQL con un solo comando.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: tienda_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tienda
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo en dev exponés la DB para conectarte desde tu IDE
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - tienda_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tienda_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/tienda
      DEBUG: "true"
      APP_NAME: Mi API de Tienda (dev)
    ports:
      - "8000:8000"
    volumes:
      # En dev montamos el código para hot reload
      - ./app:/app/app:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - tienda_net

volumes:
  pgdata:
    name: tienda_pgdata

networks:
  tienda_net:
    name: tienda_net
    driver: bridge